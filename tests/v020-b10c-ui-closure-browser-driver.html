<!doctype html><meta charset="utf-8"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;left:0;top:0;z-index:999999;background:#000;color:#fff;font:12px monospace;white-space:pre-wrap}</style><iframe id="app" src="../index.html"></iframe><pre id="result">B10C loading…</pre><script>

onst mode=d.querySelector('.modeCard'),phase=d.getElementById('duelPhaseHud');phase.classList.add('tử-chiến');const ms=w.getComputedStyle(mode),ps=w.getComputedStyle(phase);ok(ms.transitionDuration==='0s'||ms.transitionProperty==='none','shared reduced-motion transition still active');ok(ps.animationName==='none','Duel death-phase animation still active')}out.textContent=`V020_B10C_PASS ${expect} width=${w.innerWidth}`;}catch(e){fail(e.message)}},2400));})();
