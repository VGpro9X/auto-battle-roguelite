<!doctype html>
<meta charset="utf-8">
<title>V0.18 G5E browser audit</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#app{border:0;width:100vw;height:100vh;display:block}#result{position:fixed;inset:0;z-index:999999;background:#111;color:#fff;padding:20px;white-space:pre-wrap;font:14px monospace}</style>
<iframe id="app" src="../index.html"></iframe>
<script>
(async()=>{
  const topDoc=document,frame=topDoc.getElementById('app');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function waitFor(fn,label,timeout=5000){const start=performance.now();while(performance.now()-start<timeout){try{const v=fn();if(v)return v;}catch(_){}await sleep(30);}throw new Error(`timeout: ${label}`);}
  function check(value,message){if(!value)throw new Error(message);return value;}
  function visible(el){return !!el&&el.classList.contains('visible');}
  function rectInside(el,w,h,label,slack=3){const r=el.getBoundingClientRect();check(r.width>0&&r.height>0,`${label} has zero size`);check(r.left>=-slack&&r.top>=-slack&&r.right<=w+slack&&r.bottom<=h+slack,`${label} overflow ${Math.round(r.left)},${Math.round(r.top)},${Math.round(r.right)},${Math.round(r.bottom)} vs ${w}x${h}`);return r;}
  function rectHorizontal(el,w,label,slack=3){const r=el.getBoundingClientRect();check(r.width>0&&r.height>0,`${label} has zero size`);check(r.left>=-slack&&r.right<=w+slack,`${label} horizontal overflow ${Math.round(r.left)}..${Math.round(r.right)} vs ${w}`);return r;}
  function clickableAtCenter(d,el,label){const r=el.getBoundingClientRect(),hit=d.elementFromPoint(r.left+r.width/2,r.top+r.height/2);check(hit===el||el.contains(hit),`${label} center is blocked by ${hit?.id||hit?.className||hit?.tagName}`);}
  function noHorizontalOverflow(d,w,label){check(d.documentElement.scrollWidth<=w+3,`${label} horizontal overflow ${d.documentElement.scrollWidth}>${w}`);}
  async function ensureReachable(win,d,el,host,label,vw,vh){
    let r=rectHorizontal(el,vw,label);
    if(r.top<-3||r.bottom>vh+3){
      const style=win.getComputedStyle(host);
      check(style.overflowY==='auto'||style.overflowY==='scroll',`${label} is off-screen but its host is not scrollable: overflow-y=${style.overflowY}`);
      check(host.scrollHeight>host.clientHeight,`${label} host is not actually scrollable: ${host.scrollHeight}/${host.clientHeight}`);
      el.scrollIntoView({block:'nearest'});await sleep(80);r=el.getBoundingClientRect();
    }
    rectInside(el,vw,vh,label);clickableAtCenter(d,el,label);return r;
  }
  try{
    await new Promise((resolve,reject)=>{frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('iframe load timeout')),6000);});
    const win=frame.contentWindow,d=frame.contentDocument,expected=new URLSearchParams(location.search).get('expect')||'desktop';
    await waitFor(()=>d.getElementById('duelModeCard'),'duel mode card');
    if(expected==='mobile')check(win.innerWidth<=500,`mobile iframe width=${win.innerWidth}`);else check(win.innerWidth>=900,`desktop iframe width=${win.innerWidth}`);
    const vw=win.innerWidth,vh=win.innerHeight;

    noHorizontalOverflow(d,vw,'main menu');
    const play=d.querySelector('#mainMenu [data-screen="modeMenu"]');
    rectInside(play,vw,vh,'main CHƠI button');clickableAtCenter(d,play,'main CHƠI button');play.click();
    await waitFor(()=>visible(d.getElementById('modeMenu')),'mode menu');
    noHorizontalOverflow(d,vw,'mode menu');
    const modeGrid=d.querySelector('#modeMenu .modeGrid'),modeCard=d.getElementById('duelModeCard');
    await ensureReachable(win,d,modeCard,modeGrid,'Duel mode card',vw,vh);
    modeCard.click();

    await waitFor(()=>visible(d.getElementById('duelLobbyMenu')),'Duel lobby');
    noHorizontalOverflow(d,vw,'Duel lobby');
    const lobbyOverlay=d.getElementById('duelLobbyMenu'),lobbyCard=d.querySelector('#duelLobbyMenu .duelLobbyCard');
    rectHorizontal(lobbyCard,vw,'Duel lobby card');
    const start=d.getElementById('duelStartTournament');await ensureReachable(win,d,start,lobbyOverlay,'start tournament button',vw,vh);
    start.click();

    await waitFor(()=>visible(d.getElementById('duelSkillModal'))&&d.querySelectorAll('#duelChoices .duelChoice').length===3,'starter choices');
    noHorizontalOverflow(d,vw,'starter choices');
    const skillOverlay=d.getElementById('duelSkillModal'),skillCard=d.querySelector('#duelSkillModal .duelSkillCard'),choiceHost=d.getElementById('duelChoices');
    rectHorizontal(skillCard,vw,'skill modal card');
    let choices=[...d.querySelectorAll('#duelChoices .duelChoice')];
    for(const [i,button] of choices.entries())await ensureReachable(win,d,button,choiceHost,`starter choice ${i+1}`,vw,vh);
    const reroll=d.getElementById('duelReroll');await ensureReachable(win,d,reroll,skillOverlay,'reroll button',vw,vh);
    await ensureReachable(win,d,choices[0],choiceHost,'starter choice 1 return',vw,vh);choices[0].click();

    await waitFor(()=>visible(d.getElementById('duelSkillModal'))&&d.querySelectorAll('#duelChoices .duelChoice').length===3,'starter choice 2');
    choices=[...d.querySelectorAll('#duelChoices .duelChoice')];await ensureReachable(win,d,choices[0],d.getElementById('duelChoices'),'starter choice 2 first card',vw,vh);choices[0].click();

    await waitFor(()=>visible(d.getElementById('duelPreMatchMenu')),'pre-match screen');
    noHorizontalOverflow(d,vw,'pre-match screen');
    const preOverlay=d.getElementById('duelPreMatchMenu'),preCard=d.querySelector('#duelPreMatchMenu .duelPreCard');rectHorizontal(preCard,vw,'pre-match card');
    const begin=d.getElementById('duelBeginMatch');await ensureReachable(win,d,begin,preOverlay,'begin match button',vw,vh);
    begin.click();

    const combat=await waitFor(()=>{const el=d.getElementById('duelCombatRoot');if(!el||el.classList.contains('hidden'))return null;const r=el.getBoundingClientRect();return r.width>0&&r.height>0?el:null;},'sized combat root');
    const hud=d.querySelector('.duelCombatHud'),abort=d.getElementById('duelAbortButton'),canvas=d.getElementById('duelCanvas');
    rectInside(combat,vw,vh,'combat root');
    check(win.getComputedStyle(hud).pointerEvents==='none','combat HUD must remain pointer-transparent');
    check(win.getComputedStyle(abort).pointerEvents==='auto','abort button must remain interactive');
    clickableAtCenter(d,abort,'abort button');
    const centerHit=d.elementFromPoint(vw/2,vh*.57);check(centerHit===canvas||centerHit===combat||centerHit?.id==='duelCanvas',`combat center blocked by ${centerHit?.id||centerHit?.className||centerHit?.tagName}`);
    const health=d.querySelector('.duelHealthRow').getBoundingClientRect();check(health.bottom<vh*.34,`combat HUD occludes too much vertical playfield: ${Math.round(health.bottom)}/${vh}`);
    if(expected==='mobile')check(win.getComputedStyle(d.getElementById('duelCombatBuilds')).display==='none','mobile combat build tray must stay hidden');
    noHorizontalOverflow(d,vw,'combat screen');

    // G5D/G5E result presentation mirrors existing result truth and remains reachable.
    combat.classList.add('hidden');
    const resultMenu=d.getElementById('duelResultMenu');resultMenu.classList.add('visible');
    const badge=d.getElementById('duelResultBadge'),resultCard=d.querySelector('#duelResultMenu .duelResultCard');
    badge.textContent='NHÀ VÔ ĐỊCH';await sleep(40);check(resultCard.classList.contains('champion'),'Champion presentation class did not sync');
    noHorizontalOverflow(d,vw,'Champion result');rectHorizontal(resultCard,vw,'Champion result card');
    badge.textContent='BỊ LOẠI';await sleep(40);check(resultCard.classList.contains('eliminated'),'Eliminated presentation class did not sync');
    check(!resultCard.classList.contains('champion'),'Champion class leaked into eliminated state');
    for(const id of ['duelRetryTournament','duelResultMain'])await ensureReachable(win,d,d.getElementById(id),resultMenu,id,vw,vh);

    const session=win.duelSession,round=session?.currentMatch?.currentRound;
    check(round&&Number.isFinite(round.fighters.player.hp)&&Number.isFinite(round.fighters.opponent.hp),'Duel combat truth invalid after UI audit');
    topDoc.body.innerHTML=`<pre id="result">V018_G5E_BROWSER_PASS ${expected} ${vw}x${vh} round=${round.number} hud=${Math.round(health.bottom)} result=${Math.round(resultCard.getBoundingClientRect().height)}</pre>`;
  }catch(error){topDoc.body.innerHTML=`<pre id="result">V018_G5E_BROWSER_FAIL ${String(error&&error.stack||error)}</pre>`;}
})();
</script>
