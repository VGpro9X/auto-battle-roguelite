<!doctype html><meta charset="utf-8"><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden}#result{position:fixed;left:0;top:0;z-index:999999;background:#000;color:#fff;font:12px monospace;white-space:pre-wrap}</style><iframe id="app" src="../index.html"></iframe><pre id="result">B10 loading…</pre><script>

d not compact')}out.textContent=`V020_B10_UI_PASS ${expect} width=${w.innerWidth} radius=${hs.borderRadius}`;}catch(e){fail(e.message)}},1800));})();
</script>
