<!doctype html><html><head><meta charset="utf-8"><title>V0.20 B9 Survival Divine Driver</title></head><body><pre id="result">RUNNING</pre><iframe id="app" style="width:1px;height:1px;border:0"></iframe><script>
(async()=>{const out=document.getElementById('result'),params=new URLSearchParams(location.search),expect=params.get('expect')||'desktop',quality=params.get('quality')||'full';try{const frame=document.getElementById('app');frame.src=`../index.html?visualQuality=${encodeURIComponent(quality)}`;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('index load timeout')),14000);frame.onload=()=>{clearTimeout(timer);resolve();};});const w=frame.contentWindow;const started=performance.now();while(!w.SURVIVAL_HIGH_TIER_IDS_V020||!w.getSurvivalHighTierVfxStatusV020){if(performance.now()-started>12000)throw new Error('Survival spectacle loader timeout');await new Promise(r=>setTimeout(r,50));}const ids=w.SURVIVAL_HIGH_TIER_IDS_V020;if(ids.length!==20||new Set(ids).size!==20)throw new Error('expected 20 unique Survival high-tier IDs');const signatures=ids.map(id=>w.getSurvivalHighTierSignatureV020(id));if(signatures.some(s=>!s))throw new Error('missing signature');if(signatures.filter(s=>s.tier==='divine').length!==10)throw new Error('expected 10 divine');if(signatures.filter(s=>s.tier==='mystic').length!==10)throw new Error('expected 10 mystic');if(new Set(signatures.map(s=>JSON.stringify(s))).size!==20)throw new Error('signatures not distinct');const status=w.getSurvivalHighTierVfxStatusV020(),limit=quality==='full'?36:quality==='low'?12:24;if(status.quality!==quality)throw new Error(`quality expected ${quality} got ${status.quality}`);if(status.limit!==limit)throw new Error(`limit expected ${limit} got ${status.limit}`);out.textContent=`V020_B9_SURVIVAL_PASS ${expect} quality=${quality} limit=${limit} ids=${ids.length} divine=10 mystic=10`;}catch(error){out.textContent='FAIL '+error.message;console.error(error);}})();
</script></body></html>
