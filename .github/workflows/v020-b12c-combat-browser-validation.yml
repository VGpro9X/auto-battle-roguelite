name: V0.20 B12C Combat Browser Closure

on:
  push:
    branches: [main]
    paths:
      - "js/duel-vfx-v3.js"
      - "js/duel-camera.js"
      - "js/duel-renderer.js"
      - "tests/v020-b12c-combat-browser-driver.html"
      - "V020_B12_ANIMATION_COMBAT_POLISH_SPEC.md"
      - ".github/workflows/v020-b12c-combat-browser-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop/mobile/reduced-motion combat closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4186 >/tmp/v020-b12c-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo "Chrome/Chromium not found"; exit 1; }
          run_case(){
            name="$1"; size="$2"; shift 2; out="/tmp/v020-b12c-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" "$@" --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:4186/tests/v020-b12c-combat-browser-driver.html?expect=${name}" >"$out"
            grep -q "V020_B12C_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V020_B12C_PASS ${name}" "$out"
          }
          run_case desktop 1280,720
          run_case mobile 390,844
          run_case reduced 1280,720 --force-prefers-reduced-motion=reduce
