name: V0.19 A15 release validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v019-a15-release-validation
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check js/v019-survival-ai.js
          node --check js/v019-duel-ai.js
          node --check tests/v019-survival-ai-smoke.js
          node --check tests/v019-survival-utility-smoke.js
          node --check tests/v019-duel-ai-smoke.js
          node --check tests/v019-survival-simulation.js
          node --check tests/v019-duel-simulation.js
          node --check tests/v019-ai-performance-smoke.js
          node --check tests/v019-a15-release-audit.js

      - name: V0.19 promoted release audit
        run: node tests/v019-a15-release-audit.js

      - name: V0.19 deterministic and simulation closure
        shell: bash
        run: |
          set -euo pipefail
          node tests/v019-survival-ai-smoke.js
          node tests/v019-survival-utility-smoke.js
          node tests/v019-duel-ai-smoke.js
          node tests/v019-survival-simulation.js
          node tests/v019-duel-simulation.js
          node tests/v019-ai-performance-smoke.js

      - name: V0.19 promoted desktop/mobile browser closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 >/tmp/v019-a15-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi

          run_case() {
            name="$1"
            size="$2"
            out="/tmp/v019-a15-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:4180/tests/v019-a14-ai-browser-driver.html?expect=${name}" >"$out"
            grep -q "V019_A14_AI_BROWSER_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V019_A14_AI_BROWSER_PASS ${name}" "$out"
          }

          run_case desktop 1280,720
          run_case mobile 360,640
