name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js tests -type f -name '*.js' -print0 | sort -z)

      - name: V0.16 A1 smoke test
        run: node tests/v016-a1-smoke.js

      - name: V0.16 A2 smoke test
        run: node tests/v016-a2-smoke.js

      - name: V0.16 A3 smoke test
        run: node tests/v016-a3-smoke.js

      - name: V0.16 A4 smoke test
        run: node tests/v016-a4-smoke.js

      - name: V0.16 base80 integration smoke test
        run: node tests/v016-base80-integration.js

      - name: V0.16 rare curve and reroll smoke test
        run: node tests/v016-rare-reroll-smoke.js

      - name: V0.16 12-rare content smoke test
        run: node tests/v016-rare-content-smoke.js

      - name: V0.16 final 20-rare mechanics smoke test
        run: node tests/v016-rare-final-smoke.js

      - name: V0.16 layered rare ordering smoke test
        run: node tests/v016-layering-smoke.js

      - name: V0.16 Hợp Đạo B1 smoke test
        run: node tests/v016-synergies-b1-smoke.js

      - name: V0.16 Hợp Đạo B2 smoke test
        run: node tests/v016-synergies-b2-smoke.js

      - name: V0.16 28-Hợp-Đạo integration smoke test
        run: node tests/v016-synergy28-integration.js

      - name: V0.16 Siêu Cấp C1 smoke test
        run: node tests/v016-evolutions-c1-smoke.js

      - name: V0.16 12-Siêu-Cấp integration smoke test
        run: node tests/v016-evolution12-integration.js

      - name: V0.16 Endless starting rare smoke test
        run: node tests/v016-endless-starting-rare-smoke.js

      - name: V0.16 final content/truth audit smoke test
        run: node tests/v016-final-audit-smoke.js

      - name: V0.16 rare-rate balance simulation
        run: node tests/v016-balance-simulation.js

      - name: V0.16 rare VFX stress test
        run: node tests/v016-rare-vfx-stress.js

      - name: V0.16 released pressure baseline
        run: node tests/balance-baseline-v016.js

      - name: V0.17 Duel tournament and combat smoke test
        run: node tests/v017-duel-smoke.js

      - name: V0.17 D6D 50-skill Duel smoke test
        run: node tests/v017-duel-d6d-smoke.js

      - name: V0.17 D6E 60-skill Duel smoke test
        run: node tests/v017-duel-d6e-smoke.js

      - name: V0.17 D6F 70-skill Duel smoke test
        run: node tests/v017-duel-d6f-smoke.js

      - name: V0.17 D6G all-80 Duel base-skill smoke test
        run: node tests/v017-duel-d6g-smoke.js

      - name: V0.17 C1 Duel Hợp Đạo foundation smoke test
        run: node tests/v017-duel-c1-synergy-foundation-smoke.js

      - name: V0.17 C2A 8-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2a-synergy-smoke.js

      - name: V0.17 C2B 16-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2b-synergy-smoke.js

      - name: V0.17 C2C 22-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2c-synergy-smoke.js

      - name: V0.17 C2D all-28 Duel Hợp Đạo smoke test
        run: node tests/v017-duel-c2d-all28-synergy-smoke.js

      - name: V0.17 C3A 6-Siêu-Cấp Duel smoke test
        run: node tests/v017-duel-c3a-evolution-smoke.js

      - name: V0.17 C3B all-12 Siêu Cấp Duel smoke test
        run: node tests/v017-duel-c3b-all12-evolution-smoke.js

      - name: V0.17 C4 all-20 Duel rare mechanics/acquisition smoke test
        run: node tests/v017-duel-c4-all20-rare-smoke.js

      - name: V0.17 C5 full-system integration and focused balance gate
        run: node tests/v017-duel-c5-integration-balance.js

      - name: V0.17 final release audit
        run: node tests/v017-release-audit.js

      - name: V0.18 G1 asset and Renderer V2 smoke test
        run: node tests/v018-g1-assets-smoke.js

      - name: V0.18 G2A state replacement smoke test
        run: node tests/v018-g2a-state-replacement-smoke.js

      - name: V0.18 G2B locomotion anchor smoke test
        run: node tests/v018-g2b-locomotion-smoke.js

      - name: V0.18 G2C combat motion smoke test
        run: node tests/v018-g2c-combat-motion-smoke.js

      - name: V0.18 G2D presentation parity smoke test
        run: node tests/v018-g2d-presentation-parity-smoke.js

      - name: V0.18 G2E ranged cast block smoke test
        run: node tests/v018-g2e-ranged-cast-block-smoke.js

      - name: V0.18 G2F full fighter state coverage smoke test
        run: node tests/v018-g2f-full-state-coverage-smoke.js

      - name: V0.18 G3 arena camera presentation smoke test
        run: node tests/v018-g3-arena-camera-smoke.js

      - name: V0.18 G4A semantic VFX foundation smoke test
        run: node tests/v018-g4a-vfx-foundation-smoke.js

      - name: V0.18 G4B sustain/control VFX smoke test
        run: node tests/v018-g4b-sustain-control-vfx-smoke.js

      - name: V0.18 G4C advanced semantic VFX smoke test
        run: node tests/v018-g4c-advanced-vfx-smoke.js

      - name: V0.18 G4D tier and Rare VFX smoke test
        run: node tests/v018-g4d-tier-rare-vfx-smoke.js

      - name: V0.18 G4E full Duel VFX coverage audit
        run: node tests/v018-g4e-vfx-coverage-audit.js

      - name: V0.18 G5A Duel HUD presentation smoke test
        run: node tests/v018-g5a-hud-polish-smoke.js

      - name: V0.18 G5B lobby and scouting presentation smoke test
        run: node tests/v018-g5b-lobby-scouting-smoke.js

      - name: Prepare public game artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css _site/css
          cp -R js _site/js
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Validate exact V0.18 asset artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/assets/duel/fighters/base/manifest.json
          test -f _site/assets/duel/arenas/ashen-sanctum/manifest.json
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const fighterBase='_site/assets/duel/fighters/base';
          const fighter=JSON.parse(fs.readFileSync(path.join(fighterBase,'manifest.json'),'utf8'));
          for(const [state,animation] of Object.entries(fighter.animations||{})){
            if(!animation.src)throw new Error(`Manifest animation ${state} missing src`);
            const target=path.join(fighterBase,animation.src);
            if(!fs.existsSync(target))throw new Error(`Pages artifact missing ${target}`);
          }
          const arenaBase='_site/assets/duel/arenas/ashen-sanctum';
          const arena=JSON.parse(fs.readFileSync(path.join(arenaBase,'manifest.json'),'utf8'));
          for(const layer of arena.layers||[]){
            if(!layer.src)throw new Error(`Arena layer ${layer.id} missing src`);
            const target=path.join(arenaBase,layer.src);
            if(!fs.existsSync(target))throw new Error(`Pages artifact missing ${target}`);
          }
          console.log('V0.18 Pages fighter + arena asset integrity: PASS');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
