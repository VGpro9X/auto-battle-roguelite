name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js tests -type f -name '*.js' -print0 | sort -z)

      - name: V0.16 A1 smoke test
        run: node tests/v016-a1-smoke.js

      - name: V0.16 A2 smoke test
        run: node tests/v016-a2-smoke.js

      - name: V0.16 A3 smoke test
        run: node tests/v016-a3-smoke.js

      - name: V0.16 A4 smoke test
        run: node tests/v016-a4-smoke.js

      - name: V0.16 base80 integration smoke test
        run: node tests/v016-base80-integration.js

      - name: V0.16 rare curve and reroll smoke test
        run: node tests/v016-rare-reroll-smoke.js

      - name: V0.16 12-rare content smoke test
        run: node tests/v016-rare-content-smoke.js

      - name: V0.16 final 20-rare mechanics smoke test
        run: node tests/v016-rare-final-smoke.js

      - name: V0.16 layered rare ordering smoke test
        run: node tests/v016-layering-smoke.js

      - name: V0.16 Hợp Đạo B1 smoke test
        run: node tests/v016-synergies-b1-smoke.js

      - name: V0.16 Hợp Đạo B2 smoke test
        run: node tests/v016-synergies-b2-smoke.js

      - name: V0.16 28-Hợp-Đạo integration smoke test
        run: node tests/v016-synergy28-integration.js

      - name: V0.16 Siêu Cấp C1 smoke test
        run: node tests/v016-evolutions-c1-smoke.js

      - name: V0.16 12-Siêu-Cấp integration smoke test
        run: node tests/v016-evolution12-integration.js

      - name: V0.16 Endless starting rare smoke test
        run: node tests/v016-endless-starting-rare-smoke.js

      - name: V0.16 final content/truth audit smoke test
        run: node tests/v016-final-audit-smoke.js

      - name: V0.16 rare-rate balance simulation
        run: node tests/v016-balance-simulation.js

      - name: V0.16 rare VFX stress test
        run: node tests/v016-rare-vfx-stress.js

      - name: V0.16 released pressure baseline
        run: node tests/balance-baseline-v016.js

      - name: V0.17 Duel tournament and combat smoke test
        run: node tests/v017-duel-smoke.js

      - name: V0.17 D6D 50-skill Duel smoke test
        run: node tests/v017-duel-d6d-smoke.js

      - name: V0.17 D6E 60-skill Duel smoke test
        run: node tests/v017-duel-d6e-smoke.js

      - name: V0.17 D6F 70-skill Duel smoke test
        run: node tests/v017-duel-d6f-smoke.js

      - name: V0.17 D6G all-80 Duel base-skill smoke test
        run: node tests/v017-duel-d6g-smoke.js

      - name: V0.17 C1 Duel Hợp Đạo foundation smoke test
        run: node tests/v017-duel-c1-synergy-foundation-smoke.js

      - name: V0.17 C2A 8-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2a-synergy-smoke.js

      - name: V0.17 C2B 16-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2b-synergy-smoke.js

      - name: V0.17 C2C 22-Hợp-Đạo Duel smoke test
        run: node tests/v017-duel-c2c-synergy-smoke.js

      - name: V0.17 C2D all-28 Duel Hợp Đạo smoke test
        run: node tests/v017-duel-c2d-all28-synergy-smoke.js

      - name: V0.17 C3A 6-Siêu-Cấp Duel smoke test
        run: node tests/v017-duel-c3a-evolution-smoke.js

      - name: V0.17 C3B all-12 Siêu Cấp Duel smoke test
        run: node tests/v017-duel-c3b-all12-evolution-smoke.js

      - name: V0.17 C4 all-20 Duel rare mechanics/acquisition smoke test
        run: node tests/v017-duel-c4-all20-rare-smoke.js

      - name: V0.17 C5 full-system integration and focused balance gate
        run: node tests/v017-duel-c5-integration-balance.js

      - name: Prepare public game artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css _site/css
          cp -R js _site/js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
