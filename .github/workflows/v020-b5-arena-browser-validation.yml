name: V0.20 B5 arena browser validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v020-b5-arena-browser-validation
  cancel-in-progress: true

jobs:
  validate-arena-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static B5 runtime smoke
        run: node tests/v020-b5-arena-runtime-smoke.js

      - name: Desktop/mobile Ashen Sanctum browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 >/tmp/v020-b5-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "Chrome/Chromium not found on runner"
            exit 1
          fi
          run_case() {
            name="$1"; size="$2"; out="/tmp/v020-b5-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --virtual-time-budget=15000 --dump-dom "http://127.0.0.1:4180/tests/v020-b5-arena-browser-driver.html?expect=${name}" >"$out"
            grep -q "V020_B5_ARENA_BROWSER_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V020_B5_ARENA_BROWSER_PASS ${name}" "$out"
          }
          run_case desktop 1280,720
          run_case mobile 360,640
