name: V0.20 B11 Icon Validation

on:
  push:
    branches: [main]
    paths:
      - "js/v020-icons.js"
      - "js/ui.js"
      - "js/skill-codex.js"
      - "js/duel-ui-v020.js"
      - "css/v020-ui-hud.css"
      - "index.html"
      - "tests/v020-b11-icon-runtime-smoke.js"
      - "tests/v020-b11b-icon-catalog-audit.js"
      - "tests/v020-b11c-icon-browser-driver.html"
      - ".github/workflows/v020-b11-icon-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax check icon and UI runtime
        run: |
          node --check js/v020-icons.js
          node --check js/ui.js
          node --check js/skill-codex.js
          node --check js/duel-ui-v020.js
          node --check tests/v020-b11-icon-runtime-smoke.js
          node --check tests/v020-b11b-icon-catalog-audit.js
      - name: Validate B11A icon runtime
        run: node tests/v020-b11-icon-runtime-smoke.js
      - name: Audit B11B complete catalog coverage
        run: node tests/v020-b11b-icon-catalog-audit.js
      - name: Validate B11C desktop/mobile/reduced-motion presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4185 >/tmp/v020-b11-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [ -n "$chrome" ] || { echo "Chrome/Chromium not found"; exit 1; }
          run_case(){
            name="$1"; size="$2"; shift 2; out="/tmp/v020-b11-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" "$@" --virtual-time-budget=22000 --dump-dom "http://127.0.0.1:4185/tests/v020-b11c-icon-browser-driver.html?expect=${name}" >"$out"
            grep -q "V020_B11C_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V020_B11C_PASS ${name}" "$out"
          }
          run_case desktop 1280,720
          run_case mobile 1280,720
          run_case reduced 1280,720 --force-prefers-reduced-motion=reduce
