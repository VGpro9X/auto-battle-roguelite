name: V0.20 B10 UI HUD validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v020-b10-ui-hud-validation
  cancel-in-progress: true

jobs:
  validate-ui-hud-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static B10A UI/HUD smoke
        run: node tests/v020-b10-ui-hud-smoke.js

      - name: Desktop/mobile real-app composition
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4182 >/tmp/v020-b10-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "Chrome/Chromium not found"; exit 1; fi
          run_case() {
            name="$1"; size="$2"; out="/tmp/v020-b10-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:4182/tests/v020-b10-ui-hud-browser-driver.html?expect=${name}" >"$out"
            grep -q "V020_B10_UI_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V020_B10_UI_PASS ${name}" "$out"
          }
          run_case desktop 1280,720
          run_case mobile 360,640
