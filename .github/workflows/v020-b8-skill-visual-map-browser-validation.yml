name: V0.20 B8 skill visual mapping validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v020-b8-skill-visual-map-validation
  cancel-in-progress: true

jobs:
  validate-skill-visual-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static B8 mapping smoke
        run: node tests/v020-b8-skill-visual-map-smoke.js

      - name: Desktop/mobile runtime coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4180 >/tmp/v020-b8-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then echo "Chrome/Chromium not found"; exit 1; fi
          run_case() {
            name="$1"; size="$2"; out="/tmp/v020-b8-${name}.html"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --virtual-time-budget=20000 --dump-dom "http://127.0.0.1:4180/tests/v020-b8-skill-visual-map-browser-driver.html?expect=${name}" >"$out"
            grep -q "V020_B8_SKILL_VISUAL_MAP_PASS ${name}" "$out" || { cat "$out"; exit 1; }
            grep "V020_B8_SKILL_VISUAL_MAP_PASS ${name}" "$out"
          }
          run_case desktop 1280,720
          run_case mobile 360,640
